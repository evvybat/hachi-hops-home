<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hachi Hops Home!</title>
  <!-- Fredoka: a round, bubbly font. If it can't load (offline), the page and
       game fall back to the other rounded fonts listed in the CSS / style.js. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
  <main>
    <h1>Hachi Hops Home!</h1>
    <canvas id="game" width="960" height="540" tabindex="0"
            aria-label="Game screen"></canvas>
    <p class="controls">
      Move: <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> ·
      Jump: <kbd>↑</kbd> / <kbd>W</kbd> ·
      Pause: <kbd>P</kbd> ·
      Confirm: <kbd>Enter</kbd> / <kbd>Space</kbd> ·
      Restart: <kbd>R</kbd> ·
      Main menu (when paused): <kbd>Esc</kbd> ·
      Sound: <kbd>M</kbd>
    </p>
  </main>
  <script type="module" src="static/js/game.js"></script>
</body>
</html>
